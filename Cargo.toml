[package]
name = "qwen3-image21"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.6"
half = "2.5"
image = "0.25"
tokenizers = "0.21"
rand = "0.9"
rand_distr = "0.5"
candle-flash-attn = { version = "0.11", optional = true }

[features]
default = []
# Pick one at build time: `cargo build --release --features metal` (macOS)
# or `cargo build --release --features cuda` (Linux/NVIDIA). Building with
# neither runs on CPU only.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# FlashAttention v2 for unmasked attention (`--flash-attn`). CUDA only, sm80+;
# compiles the flash-attn kernels with nvcc (slow first build).
flash-attn = ["cuda", "dep:candle-flash-attn"]
